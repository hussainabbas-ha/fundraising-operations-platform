<div class="container-fluid h-100">
    <div class="row height_100">
        <div class="col-12 col-lg-6 auth_background  text-white d-flex align-items-center justify-content-center">
            <div class="logo">
                <img src="/assets/logos/auth_logo.png" alt="victory-funds-logo">
            </div>
        </div>
        <div class="col-12 col-lg-6">
            <div class="auth_right_column">
                <div>
                    <h1>Login</h1>
                    <!-- <p>Don't have an account? <a routerLink="/signup" class="orange text-decoration-none"> Create Now</a>
                    </p> -->
                </div>

                <form class="mt-3" [formGroup]="form" (ngSubmit)="submit()">
                    <div class="form-group">
                        <mat-label>Email</mat-label>
                        <mat-form-field class="w-100" appearance="outline">
                            <input matInput form placeholder="Email Address" formControlName="email" type="email" />
                            <i matPrefix class="fa-solid fa-envelope px-3"></i>
                            <mat-error>
                                <vmessage field="email" [control]="form.controls['email']">
                                </vmessage>
                            </mat-error>
                        </mat-form-field>
                    </div>
                    <div class="form-group">
                        <mat-label>Password</mat-label>
                        <mat-form-field class="w-100" appearance="outline">
                            <i matPrefix class="fa-solid fa-lock px-3"></i>
                            <input matInput placeholder="Password" formControlName="password" [type]="showPassword ? 'text' : 'password'" />
                            <i matSuffix (click)="showPassword = !showPassword" class="fa-solid" [ngClass]="showPassword ? 'fa-eye' : 'fa-eye-slash'"></i>
                            <mat-error>
                                <vmessage field="password" [control]="form.controls['password']">
                                </vmessage>
                            </mat-error>
                        </mat-form-field>
                    </div>
                    <div class="mt-1">
                        <button mat-ripple type="submit" class="btn btn-primary authButtons w-100">Sign In</button>
                    </div>
                    <div class="mt-3">
                        <a href="" class="orange">Forgot Password?</a>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>
