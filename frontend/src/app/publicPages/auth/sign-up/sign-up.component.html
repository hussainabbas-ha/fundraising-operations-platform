<div class="container-fluid h-100">
    <div class="row height_100">
        <div
            class="col-12 col-lg-6 auth_background bg-danger text-white d-flex align-items-center justify-content-center">
            <div class="logo">
                <img src="/assets/logos/auth_logo.png" alt="victory-funds-logo">
            </div>
        </div>
        <div class="col-12 col-lg-6">
            <div class="auth_right_column">
                <form class="mt-3" [formGroup]="form" (ngSubmit)="submit()" *ngIf="valid">
                    <div>
                        <h1>Sign Up</h1>
                        <p>Already have an account? <a routerLink="/login" class="orange text-decoration-none">
                                Login</a></p>
                    </div>

                    <div class="row">
                        <div class="col-12 col-md-6">
                            <div class="form-group">
                                <mat-label>First Name</mat-label>
                                <mat-form-field class="w-100" appearance="outline">
                                    <input matInput formControlName="firstName" placeholder="First Name" type="text">
                                    <mat-error>
                                        <vmessage field="firstName" [control]="form.controls['firstName']">
                                        </vmessage>
                                    </mat-error>
                                </mat-form-field>
                            </div>
                        </div>
                        <div class="col-12 col-md-6">
                            <div class="form-group">
                                <mat-label>Last Name</mat-label>
                                <mat-form-field class="w-100" appearance="outline">
                                    <input matInput formControlName="lastName" placeholder="Last Name" type="text">
                                    <mat-error>
                                        <vmessage field="lastName" [control]="form.controls['lastName']">
                                        </vmessage>
                                    </mat-error>
                                </mat-form-field>
                            </div>
                        </div>
                        <div class="col-12">
                            <div class="form-group">
                                <mat-label>Email</mat-label>
                                <mat-form-field class="custom-outline w-100 mt-2" appearance="outline" >
                                    <input matInput form placeholder="Email Address" formControlName="email" readonly
                                        type="email" />
                                    <i matPrefix class="fa-solid fa-envelope px-3"></i>
                                    <mat-error>
                                        <vmessage field="email" [control]="form.controls['email']">
                                        </vmessage>
                                    </mat-error>
                                </mat-form-field>
                            </div>
                        </div>

                        <div class="col-12">
                            <div class="form-group">
                                <mat-label>Address</mat-label>
                                <mat-form-field class="custom-outline w-100 mt-2" appearance="outline" >
                                    <input matInput form placeholder="Address" formControlName="address"
                                        type="text" />
                                    <i matPrefix class="fa-solid fa-location-dot px-3"></i>
                                    <mat-error>
                                        <vmessage field="address" [control]="form.controls['address']">
                                        </vmessage>
                                    </mat-error>
                                </mat-form-field>
                            </div>
                        </div>
                        <div class="col-12 col-md-6">
                            <div class="form-group">
                                <mat-label>Zip Code</mat-label>
                                <mat-form-field class="w-100" appearance="outline">
                                    <input matInput form placeholder="Zip Code" formControlName="zipCode" type="number" />
                                    <mat-error>
                                        <vmessage field="zipCode" [control]="form.controls['zipCode']">
                                        </vmessage>
                                    </mat-error>
                                </mat-form-field>
                            </div>
                        </div>
                        <div class="col-12 col-md-6">
                            <div class="form-group">
                                <mat-label>Phone</mat-label>
                                <mat-form-field class="w-100" appearance="outline">
                                    <input matInput form placeholder="Phone No" formControlName="phoneNo" type="tel" />
                                    <mat-error>
                                        <vmessage field="phoneNo" [control]="form.controls['phoneNo']">
                                        </vmessage>
                                    </mat-error>
                                </mat-form-field>
                            </div>
                        </div>
                        <!-- <div class="col-12 col-md-6">
                            <div class="form-group">
                                <mat-label>Designation</mat-label>
                                <mat-form-field class="w-100" appearance="outline">
                                    <input matInput formControlName="designation" placeholder="Designation" type="text">
                                    <mat-error>
                                        <vmessage field="designation" [control]="form.controls['designation']">
                                        </vmessage>
                                    </mat-error>
                                </mat-form-field>
                            </div>
                        </div> -->
                        <div class="col-12">
                            <div class="form-group">
                                <mat-label>Password</mat-label>
                                <mat-form-field class="custom-outline w-100 mt-2" appearance="outline">
                                    <i matPrefix class="fa-solid fa-lock px-3"></i>
                                    <input matInput placeholder="Passsword" formControlName="password"
                                        [type]="showPassword ? 'text' : 'password'" />
                                    <i matSuffix (click)="showPassword = !showPassword" class="fa-solid"
                                        [ngClass]="showPassword ? 'fa-eye' : 'fa-eye-slash'"></i>
                                    <mat-error>
                                        <vmessage field="password" [control]="form.controls['password']">
                                        </vmessage>
                                    </mat-error>
                                </mat-form-field>
                            </div>
                        </div>
                        <div class="col-12">
                            <div class="form-group">
                                <mat-label>Confirm Password</mat-label>
                                <mat-form-field class="custom-outline w-100 mt-2" appearance="outline">
                                    <i matPrefix class="fa-solid fa-lock px-3"></i>
                                    <input matInput placeholder="Confirm Passsword" formControlName="confirm_password"
                                        [type]="confirmPasswordShow ? 'text' : 'password'" />
                                    <i matSuffix (click)="confirmPasswordShow = !confirmPasswordShow" class="fa-solid"
                                        [ngClass]="confirmPasswordShow ? 'fa-eye' : 'fa-eye-slash'"></i>
                                    <mat-error>
                                        <vmessage field="confirm_password"
                                            [control]="form.controls['confirm_password']">
                                        </vmessage>
                                    </mat-error>
                                </mat-form-field>
                            </div>
                        </div>
                    </div>
                    <div>
                        <button type="submit" class="btn btn-primary authButtons  w-100">Sign Up</button>
                    </div>
                </form>
                <div class="card text-center" *ngIf="!valid" >
                    <div class="card-body p-4">
                        <h5>Your code has expired as 24 hours have passed. To proceed, please contact the administrator for further assistance."</h5>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
