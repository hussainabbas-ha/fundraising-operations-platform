        <div id="sidebar-menu">
            <ul>
                <ng-container *ngFor="let item of naviIteam">
                    <li>
                        <a routerLink="{{item.url}}" Permission="{{item.permission}}:view" routerLinkActive="active"
                            (click)="closeMenu()" *ngIf="!item.childs">
                            <i *ngIf="item.icon" class="{{item.icon}}"></i>
                            <span>{{item.label}}</span>
                        </a>

                        <a (click)="item.open = !item.open;" Permission="{{item.permission}}:view"
                            class="multiple-items" [ngClass]="{ 'oppened': item.open }"
                            *ngIf="item.childs && item.childs.length > 0">
                            <i *ngIf="item.icon" class="{{item.icon}}"></i>
                            <span>{{item.label}}</span>
                            <i class="fa-solid fa-chevron-up float-end" [class.open]="item.open"></i>
                        </a>
                        <div class="collapse nav-second-level-hover" [ngClass]="{ 'show': item.open }"
                            *ngIf="item.childs && item.childs.length">
                            <ul class="nav-second-level">
                                <ng-container *ngFor="let subitem of item.childs">
                                    <li>
                                        <a routerLink="{{item.url}}/{{subitem.url}}" routerLinkActive="active"
                                            Permission="{{subitem.permission}}:view" (click)="closeMenu()"
                                            class="text-decoration-none">
                                            <i *ngIf="subitem.icon" class="{{subitem.icon}}"></i>
                                            <span> {{subitem.label}}</span>
                                        </a>

                                    </li>
                                </ng-container>
                            </ul>
                        </div>
                    </li>
                </ng-container>


            </ul>
            <div class="bottom-sheet" [class.show]="isOpen">
                <ul>
                    <li>
                        <a routerLinkActive="menuitem-active" routerLink="profile" (click)="isOpen=!isOpen"
                            Permission="user:view">
                            <i class="fa-solid fa-user"></i>
                            <span>Profile</span>
                        </a>
                    </li>
                    <li>
                        <a routerLinkActive="menuitem-active" (click)="changePassword()">
                            <i class="fa-solid fa-lock"></i>
                            <span>Change Password</span>
                        </a>
                    </li>
                    <li routerLinkActive="menuitem-active">
                        <a (click)="logout()">
                            <i class="fa-solid fa-arrow-right-from-bracket"></i>
                            <span>Logout</span>
                        </a>
                    </li>
                </ul>
            </div>
            <div class="userInfo">
                <div class="d-flex align-items-center text-dark" (click)="toggleDiv()">
                    <div class="user-image">
                        <img src="/assets/images/demo-user.jpg" alt="user-iamge">
                    </div>
                    <div class="mx-2 flex-grow-1 text-capitalize">
                        <h6 class="m-0 ">{{userInfo?.firstName}}</h6>
                        <small class="text-secondary">{{userInfo?.role.name}}</small>
                    </div>
                    <i class="fa-solid fa-chevron-up float-end"></i>
                </div>
            </div>

        </div>

        <div class="clearfix">

        </div>
    </div>
