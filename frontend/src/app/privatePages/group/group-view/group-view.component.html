<div class="org-cover-img">
    <img src="{{coverImages}}" alt="Cover image" onError="this.src='assets/images/banner-image.png'">
</div>
<div class="line-bar">

    <div class="row">
        <div class="col-md-4 col-xxl-3 ps-md-5">
            <div class="card shadow" style="margin-top:-50px;">
                <div class="card-body p-5">
                    <div class="profile-image shadow mx-auto">
                        <div class="no-image" *ngIf="!imagePreview" (click)="uploadFile.click()">
                            <i class="fa-solid fa-camera"></i>
                        </div>
                        <img src="{{imagePreview}}" alt="demo-user" *ngIf="imagePreview">
                    </div>
                    <div>
                        <div class="my-4 text-capitalize text-center">
                            <h4>{{data?.name}}</h4>
                        </div>
                        <div class="mb-2">
                            <i class="fa-solid fa-user me-3 "></i>
                            <span class="text-muted small">{{data?.name}}</span>
                        </div>
                        <!-- <div class="mb-2">
                            <a href="mailto:{{data?.email}}" class="text-decoration-none">
                                <i class="fa-solid fa-envelope text-warning me-3 "></i>
                                <span class="text-muted small">{{data?.email}}</span>
                            </a>
                        </div>
                        <div class="mb-2">
                            <a href="mailto:{{data?.phoneNo}}" class="text-decoration-none">
                                <i class="fa-solid fa-phone text-secondary me-3 "></i>
                                <span class="text-muted small">{{data?.phoneNo}}</span>
                            </a>
                        </div>
                        <div class="mb-2">
                            <i class="fa-solid fa-location-dot text-success me-3 "></i>
                            <span class="text-muted small">{{data?.address}}</span>
                        </div> -->
                    </div>
                    <div class="mt-3">
                        <button mat-ripple class="btn btn-secondary btn-sm mb-2 p-2 w-100"
                            Permission="group:update" (click)="updateGroup()"><i
                                class="fa-solid fa-pen-to-square"></i>EDIT</button>
                        <button mat-ripple class="btn btn-danger text-light btn-sm p-2 w-100" (click)="deleteGroup()"
                            Permission="group:delete"><i class="fa-solid fa-trash-can"></i> DELETE</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-8 col-xxl-9">
            <mat-tab-group [(selectedIndex)]="selectedIndex">
                <mat-tab label="Groups">
                    <div class="scroll-wrapper mx-2">
                        <div class="scroll-container">
                            <div class="scrollable">
                                <table class="table data-table">
                                    <thead>
                                        <tr>
                                            <th>Name</th>
                                            <th>Members</th>
                                            <th width="5%"></th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr *ngFor="let item of dataSource">
                                            <td class="d-flex align-items-center c-100">
                                                <div class="image">
                                                    <img [src]="item.logo" alt="{{item.name + 'logo'}}"
                                                        onError="this.src='/assets/images/victory.png'">
                                                </div>
                                                <div class="ms-2">
                                                    <span class="label text-capitalize">Name</span>{{item.name}}
                                                </div>
                                            </td>
                                            <td>5</td>
                                            <td class="action-button">
                                                <a class="btn btn-sm btn-light" mat-ripple [matMenuTriggerFor]="menu"><i
                                                        class="fa-solid fa-ellipsis-vertical"></i></a>
                                                <mat-menu #menu="matMenu" class="bg-light">
                                                    <button mat-menu-item mat-ripple Permission="group:view"
                                                        (click)="view(item._id)"><i
                                                            class="fa-regular fa-file-lines text-info"></i>
                                                        View</button>
                                                    <button mat-menu-item mat-ripple Permission="group:update"
                                                        (click)="newDialog(item._id)"><i
                                                            class="fa-regular fa-pen-to-square text-success"></i>
                                                        Update</button>
                                                    <button mat-menu-item mat-ripple Permission="group:delete"
                                                        (click)="deleteGroup(item._id)"><i
                                                            class="fa-regular fa-trash-can text-danger"></i>
                                                        Delete</button>
                                                </mat-menu>
                                            </td> 
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        <pagination [pager]="pager" [params]="queryParams"></pagination>
                    </div>
                </mat-tab>
                <mat-tab label="Campaign">
                    <h5>Profile Tab</h5>
                    <p>Content for the Profile tab.</p>
                </mat-tab>
                <mat-tab label="Contact">
                    <h5>Contact Tab</h5>
                    <p>Content for the Contact tab.</p>
                </mat-tab>
            </mat-tab-group>
        </div>
    </div>
</div>
