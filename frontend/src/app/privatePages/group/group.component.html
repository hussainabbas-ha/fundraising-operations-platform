<div class="page-header">
    <div class="row align-items-top">
        <div class="col-md-3 col-12">
            <h1 class="mb-0">Groups</h1>
            <p class="text-secondary mb-2 mb-md-0">List of Groups</p>
        </div>
        <div class="col-md-6 col-9">
            <form [formGroup]="search" (ngSubmit)="filter()">
                <div class="form-group">
                    <mat-form-field class="w-100" appearance="outline">
                        <input matInput placeholder="Search Group" type="text" formControlName="q" />
                        <i matSuffix class="fa-solid fa-magnifying-glass"></i>
                    </mat-form-field>
                </div>
            </form>
        </div>
        <div class="col-md-3 col-3">
            <button mat-ripple Permission="group:add" (click)="newDialog()"
                class="btn btn-secondary text-light w-100"><i class="fa-solid fa-plus"></i> <span
                    class="d-none d-md-inline"> New</span></button>
        </div>
    </div>
</div>
<div class="scroll-wrapper">
<div class="scroll-container">
    <div class="scrollable">
        <table class="table data-table" matSort (matSortChange)="sortData($event)">
            <thead>
                <tr>
                    <th mat-sort-header="name">Name</th>
                    <th>Organization Name</th>
                    <th width="5%"></th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let item of dataSource">
                    <td class="d-flex align-items-center c-100">
                        <div class="image">
                            <img [src]="item.logo" alt="{{item.name + 'logo'}}"
                                onError="this.src='/assets/images/victory.png'">
                        </div>
                        <div class="ms-2">
                            <span class="label text-capitalize">Name</span>{{item.name}}
                        </div>
                    </td>
                    <td><span class="label">Organization Name</span>{{item.organizationName}}</td>
                    <td class="action-button">
                        <a class="btn btn-sm btn-light" mat-ripple [matMenuTriggerFor]="menu"><i
                                class="fa-solid fa-ellipsis-vertical"></i></a>
                        <mat-menu #menu="matMenu" class="bg-light">
                            <button mat-menu-item mat-ripple Permission="group:view" (click)="view(item._id)"><i
                                    class="fa-regular fa-file-lines text-info"></i> View</button>
                            <button mat-menu-item mat-ripple Permission="group:update" (click)="newDialog(item._id)"><i
                                    class="fa-regular fa-pen-to-square text-success"></i>
                                Update</button>
                            <button mat-menu-item mat-ripple Permission="group:delete"
                                (click)="deleteGroup(item._id)"><i class="fa-regular fa-trash-can text-danger"></i>
                                Delete</button>
                        </mat-menu>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
<pagination [pager]="pager" [params]="queryParams"></pagination>
</div>
