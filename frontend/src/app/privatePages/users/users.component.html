<div class="page-header">
    <div class="row align-items-top">
        <div class="col-md-3 col-12">
            <h1 class="mb-0">Users</h1>
            <p class="text-secondary mb-2 mb-md-0">List of Users</p>
        </div>
        <div class="col-md-6 col-9">
            <form [formGroup]="search" (ngSubmit)="filter()">
                <div class="form-group">
                    <mat-form-field class="w-100" appearance="outline">
                        <input matInput placeholder="Search User" type="text" formControlName="q" />
                        <i matSuffix class="fa-solid fa-magnifying-glass"></i>
                    </mat-form-field>
                </div>
            </form>
        </div>
        <div class="col-md-3 col-3">
            <button mat-ripple Permission="user:invite" (click)="inviteUser()"
                class="btn btn-secondary text-light w-100"><i class="fa-solid fa-plus"></i> <span
                    class="d-none d-md-inline"> Invite User</span></button>
        </div>
        <div class="col-md-3 col-3">
            <button mat-ripple Permission="user:add" (click)="newDialog()" class="btn btn-secondary text-light w-100"><i
                    class="fa-solid fa-plus"></i> <span class="d-none d-md-inline"> New</span></button>
        </div>
    </div>
</div>
<div class="scroll-wrapper">
    <div class="scroll-container">
        <div class="scrollable">
            <table class="table data-table" matSort (matSortChange)="sortData($event)">
                <thead>
                    <tr>
                        <th mat-sort-header="firstName">First Name</th>
                        <th>Last Name</th>
                        <th>Email</th>
                        <th>Status</th>
                        <th width="5%"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let item of dataSource">
                        <td class="d-flex align-items-center c-100">
                            <div class="image">
                                <img [src]="item.image" alt="{{item.name + 'image'}}"
                                    onError="this.src='/assets/images/victory.png'">
                            </div>
                            <div class="ms-2">
                                <span class="label text-capitalize">First Name</span>{{item.firstName}}
                            </div>
                        </td>

                        <td class="text-capitalize"><span class="label">Last Name</span>{{item.lastName}}</td>
                        <td class="c-100"><span class="label">Email</span>{{item.email}}</td>
                        <td class="text-capitalize"><span class="label">Status</span><span
                                [Status]="item.status">{{item.status}}</span></td>
                        <td class="action-button">
                            <a class="btn btn-sm btn-light" mat-ripple [matMenuTriggerFor]="menu"><i
                                    class="fa-solid fa-ellipsis-vertical"></i></a>
                            <mat-menu #menu="matMenu" class="bg-light">
                                <button mat-menu-item mat-ripple Permission="user:view" (click)="view(item._id)"><i
                                        class="fa-regular fa-file-lines text-info"></i> View</button>
                                <button mat-menu-item mat-ripple Permission="user:update"
                                    (click)="newDialog(item._id)"><i
                                        class="fa-regular fa-pen-to-square text-success"></i> Update</button>
                                <button mat-menu-item mat-ripple Permission="user:delete"
                                    (click)="deleteUser(item._id)"><i class="fa-regular fa-trash-can text-danger"></i>
                                    Delete</button>
                            </mat-menu>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <pagination [pager]="pager" [params]="queryParams"></pagination>
</div>
