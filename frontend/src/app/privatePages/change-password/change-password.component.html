<div class="container p-4">
    <div class="row align-items-baseline">
        <div class="col-8">
            <h4>Change Password</h4>
        </div>
        <div class="col-4">
            <button class="btn btn-secondary btn-sm float-end" mat-ripple type="button" (click)="close();">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
    </div>
    <hr class="my-1">
</div>
<form [formGroup]="form" (ngSubmit)="submit()">
    <div class="container px-4">
        <div class="row">
            <div class="col-12">
                <div class="form-group">
                    <mat-label>Current Password</mat-label>
                    <mat-form-field class="w-100" appearance="outline">
                        <i matPrefix class="fa-solid fa-lock px-3"></i>
                        <input matInput placeholder="Current Password" formControlName="oldPassword" [type]="showOldPassword ? 'text' : 'password'" />
                        <i matSuffix (click)="showOldPassword = !showOldPassword" class="fa-solid" [ngClass]="showOldPassword ? 'fa-eye' : 'fa-eye-slash'"></i>
                        <mat-error>
                            <vmessage field="oldPassword" [control]="form.controls['oldPassword']">
                            </vmessage>
                        </mat-error>
                    </mat-form-field>
                </div>
            </div>
            <div class="col-12">
                <div class="form-group">
                    <mat-label>New Password</mat-label>
                    <mat-form-field class="w-100" appearance="outline">
                        <i matPrefix class="fa-solid fa-lock px-3"></i>
                        <input matInput placeholder="New Password" formControlName="newPassword" [type]="showNewPassword ? 'text' : 'password'" />
                        <i matSuffix (click)="showNewPassword = !showNewPassword" class="fa-solid" [ngClass]="showNewPassword ? 'fa-eye' : 'fa-eye-slash'"></i>
                        <mat-error>
                            <vmessage field="newPassword" [control]="form.controls['newPassword']">
                            </vmessage>
                        </mat-error>
                    </mat-form-field>
                </div>
            </div>
            <div class="col-12">
                <div class="form-group">
                    <mat-label>Confirm Password</mat-label>
                    <mat-form-field class="w-100" appearance="outline">
                        <i matPrefix class="fa-solid fa-lock px-3"></i>
                        <input matInput placeholder="Confirm Password" formControlName="confirmPassword" [type]="showConfirmPassword ? 'text' : 'password'" />
                        <i matSuffix (click)="showConfirmPassword = !showConfirmPassword" class="fa-solid" [ngClass]="showConfirmPassword ? 'fa-eye' : 'fa-eye-slash'"></i>
                        <mat-error>
                            <vmessage field="confirmPassword" [control]="form.controls['confirmPassword']">
                            </vmessage>
                        </mat-error>
                    </mat-form-field>
                </div>
            </div>
        </div>
    </div>
    <div class="footer-section bg-cp_1 p-3 mt-2">
        <div class="row align-items-center">
            <div class="col-md-8 col-12">
                <small class="text-light">You can update password by clicking the update.</small>
            </div>
            <div class="col-md-4 col-12 text-end">
                <button class="btn btn-secondary  w-100" type="submit" >Update</button>
            </div>

        </div>
       
    </div>
</form>
