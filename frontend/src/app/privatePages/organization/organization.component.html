<div class="page-header">
    <div class="row align-items-top">
        <div class="col-md-4 col-12">
            <h1 class="mb-0">Organizations</h1>
            <p class="text-secondary mb-2 mb-md-0">List of Organizations</p>
        </div>
        <div class="col-md-5 col-9">
            <form [formGroup]="search" (ngSubmit)="filter()">
                <div class="form-group">
                    <mat-form-field class="w-100" appearance="outline">
                        <input matInput placeholder="Search Organization" type="text" formControlName="q" />
                        <i matSuffix class="fa-solid fa-magnifying-glass"></i>
                    </mat-form-field>
                </div>
            </form>
        </div>
        <div class="col-md-3 col-3">
            <button mat-ripple Permission="organization:add" (click)="newDialog()"
                class="btn btn-secondary text-light w-100"><i class="fa-solid fa-plus"></i> <span
                    class="d-none d-md-inline"> New</span></button>
        </div>
    </div>
</div>
<div class="scroll-wrapper">
    <div class="scroll-container">
        <div class="scrollable">
            <table class="table data-table" matSort (matSortChange)="sortData($event)">
                <thead>
                    <tr>
                        <th mat-sort-header="name">Name</th>
                        <th>Address</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th width="5%"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let item of dataSource">
                        <td class="d-flex align-items-center c-100">
                            <div class="image">
                                <img [src]="item.logo" alt="{{item.name + 'logo'}}"
                                    onError="this.src='/assets/images/victory.png'">
                            </div>
                            <div class="ms-2">
                                <span class="label text-capitalize">Name</span>{{item.name}}
                            </div>
                        </td>
                        <td><i class="fa-solid fa-location-dot me-2 text-success"></i><span
                                class="label">Address</span>{{item.address}}
                        </td>
                        <td class="c-100"> <i class="fa-solid fa-envelope me-2 text-warning"></i><span
                                class="label">Email</span>{{item.email}}</td>
                        <td> <i class="fa-solid fa-phone me-2"></i><span class="label">Phone</span>{{item.phoneNo}}
                        </td>
                        <td class="action-button">
                            <a class="btn btn-sm btn-light" mat-ripple [matMenuTriggerFor]="menu"><i
                                    class="fa-solid fa-ellipsis-vertical"></i></a>
                            <mat-menu #menu="matMenu" class="bg-light">
                                <button mat-menu-item mat-ripple Permission="organization:view"
                                    (click)="view(item._id)"><i class="fa-regular fa-file-lines text-info"></i>
                                    View</button>
                                <button mat-menu-item mat-ripple Permission="organization:update"
                                    (click)="newDialog(item._id)"><i
                                        class="fa-regular fa-pen-to-square text-success"></i>
                                    Update</button>
                                <button mat-menu-item mat-ripple Permission="organization:delete"
                                    (click)="deleteOrganization(item._id)"><i
                                        class="fa-regular fa-trash-can text-danger"></i> Delete</button>
                            </mat-menu>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <pagination [pager]="pager" [params]="queryParams"></pagination>
</div>
