<div class="container p-4">
    <div class="row align-items-baseline">
        <div class="col-8">
            <h4>{{(_id)?'Update' : 'New'}} Vendor</h4>
        </div>
        <div class="col-4">
            <button class="btn btn-secondary btn-sm float-end" mat-ripple type="button" (click)="close();">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
    </div>
    <hr class="my-1">
</div>
<form [formGroup]="form" (ngSubmit)="submit()">
    <div class="container px-4">
        <div class="row">
            <div class="col-12">
                <div class="form-group">
                    <mat-label>Title</mat-label>
                    <mat-form-field class="w-100" appearance="outline">
                        <input matInput formControlName="title" placeholder="Title" type="text">
                        <mat-error>
                            <vmessage field="title" [control]="form.controls['title']">
                            </vmessage>
                        </mat-error>
                    </mat-form-field>
                </div>
            </div>
            <div class="col-12">
                <div class="form-group">
                    <mat-label>Phone</mat-label>
                    <mat-form-field class="w-100" appearance="outline">
                        <input matInput formControlName="phoneNo" placeholder="Phone Number" type="text">
                        <mat-error>
                            <vmessage field="phoneNo" [control]="form.controls['phoneNo']">
                            </vmessage>
                        </mat-error>
                    </mat-form-field>
                </div>
            </div>
            <div class="col-12">
                <div class="form-group">
                    <mat-label>Address</mat-label>
                    <mat-form-field class="w-100" appearance="outline">
                        <input matInput formControlName="address" placeholder="Address" type="text">
                        <mat-error>
                            <vmessage field="address" [control]="form.controls['address']">
                            </vmessage>
                        </mat-error>
                    </mat-form-field>
                </div>
            </div>
           
        </div>
    </div>
    <div class="footer-section bg-cp_1 p-3 mt-2">
        <div class="row align-items-center">
            <div class="col-md-8 col-12">
                <small class="text-light">You can {{(_id)?'update' : 'create'}} Vendor by clicking the {{(_id)?'update' : 'create'}}.</small>
            </div>
            <div class="col-md-4 col-12 text-end">
                <button class="btn btn-secondary  w-100" type="submit" >{{(_id)?'Update' : 'Create'}}</button>
            </div>

        </div>
       
    </div>
</form>
